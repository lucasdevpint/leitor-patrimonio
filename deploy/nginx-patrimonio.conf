# /etc/nginx/sites-available/patrimonio
# Proxy reverso: porta 80 (padrão) → API na porta 8000
# Assim ninguém precisa digitar ":8000" para acessar.

server {
    listen 80;
    listen [::]:80;

    # Substitua pelo IP fixo do servidor, ou deixe "_" para aceitar qualquer host
    server_name _;

    # Tamanho máximo de upload (fotos de patrimônio)
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts maiores para relatórios grandes
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    access_log /var/log/nginx/patrimonio-access.log;
    error_log  /var/log/nginx/patrimonio-error.log;
}
